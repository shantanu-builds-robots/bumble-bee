name: delivery_city
description: >
  The original delivery area (same pads and parcels as bumble-bee's delivery_area.world) with
  buildings standing on several of the straight-line routes between pick-ups and drop zones.
  Flying at the mission's 0.7 m cruise height, the drone has to go around them.
spawn: {xyz: [0.5, 0.5, 0.1], yaw: 0}
pads:
  - {xyz: [0.5, 0.5]}   # home
  - {xyz: [9.5, 9.5]}
  - {xyz: [4.5, 5.5]}
  - {xyz: [0.5, 9.5]}
  - {xyz: [9.5, 0.5]}
parcels:
  - {model: box_0, xyz: [0.5, 2.0]}
  - {model: box_2, xyz: [1.5, 2.0]}
  - {model: box_3, xyz: [1.5, 3.0]}
  - {model: box_4, xyz: [0.5, 3.0]}
buildings:
  - {xyz: [0.6, 6.2], size: [1.6, 1.4, 4.0]}           # on the box_0 -> (0.5, 9.5) route
  - {xyz: [5.8, 6.0], size: [1.4, 1.4, 6.0]}           # on the box_2 -> (9.5, 9.5) diagonal
  - {xyz: [3.2, 4.4], size: [0.9, 0.9, 3.0], yaw: 30}  # on the box_3 -> (4.5, 5.5) route
  - {xyz: [5.2, 1.8], size: [1.8, 1.2, 5.0]}           # on the box_4 -> (9.5, 0.5) route
  - {xyz: [7.6, 4.0], size: [1.2, 2.2, 3.5]}
  - {xyz: [3.0, 8.4], size: [1.4, 1.0, 4.5]}
mission:   # the same four deliveries bumble-bee's deliver node flies in delivery_area.world
  home: [0.5, 0.5]
  cruise: 0.7
  deliveries:
    - {pickup: [0.5, 2.0], drop: [0.5, 9.5]}
    - {pickup: [1.5, 2.0], drop: [9.5, 9.5]}
    - {pickup: [1.5, 3.0], drop: [4.5, 5.5]}
    - {pickup: [0.5, 3.0], drop: [9.5, 0.5]}
